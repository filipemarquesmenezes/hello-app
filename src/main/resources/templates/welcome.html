<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f6fb; color: #17243b; font-family: system-ui, sans-serif; }
        main { width: min(100%, 560px); padding: clamp(24px, 6vw, 48px); background: white; border: 1px solid #dde5ef; border-radius: 20px; box-shadow: 0 16px 48px #17243b0a; }
        .label { color: #3461bf; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 16px 0; font-size: clamp(28px, 6vw, 40px); letter-spacing: -.04em; }
        p { line-height: 1.6; color: #526079; }
        a, button { display: inline-block; margin-top: 20px; padding: 12px 20px; border-radius: 8px; background: #234fa5; color: white; font-weight: 600; text-decoration: none; border: 0; font: inherit; cursor: pointer; }
        a:hover, button:hover { background: #193e86; }
        a:focus-visible, button:focus-visible { outline: 3px solid #7ca4f4; outline-offset: 4px; }
    </style>
</head>
<body>
<main>
    <h1>Welcome.</h1>
    <a href="/oauth2/authorization/github">Login with GitHub</a>
</main>
</body>
</html>
