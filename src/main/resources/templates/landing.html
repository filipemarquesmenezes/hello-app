<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f6fb; color: #17243b; font-family: system-ui, sans-serif; }
        main { width: min(100%, 640px); background: white; border: 1px solid #dde5ef; border-radius: 20px; box-shadow: 0 16px 48px #17243b0a; overflow: hidden; }

        .section { padding: 32px; }
        .section + .section { border-top: 1px solid #eef2f8; }

        /* Profile */
        .profile-header { display: flex; gap: 20px; align-items: center; }
        .avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 1px solid #dde5ef; flex-shrink: 0; }
        .profile-info { min-width: 0; }
        .profile-name { margin: 0; font-size: 22px; letter-spacing: -.03em; }
        .profile-login { color: #526079; font-size: 14px; margin: 2px 0 0; }
        dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 20px 0 0; font-size: 14px; }
        dt { color: #526079; }
        dd { margin: 0; overflow-wrap: anywhere; }

        /* Headings */
        h2 { margin: 0 0 16px; font-size: 18px; letter-spacing: -.02em; }

        /* Cat fact */
        .cat-fact { line-height: 1.6; color: #526079; margin: 0; }

        /* Tasks */
        .new-task { display: flex; gap: 8px; margin-bottom: 20px; }
        .new-task input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #dde5ef; border-radius: 8px; font: inherit; font-size: 14px; }
        .new-task input[type="text"]:focus { outline: 2px solid #7ca4f4; border-color: transparent; }

        .btn { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #234fa5; color: white; border: 0; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #193e86; }
        .btn:focus-visible { outline: 3px solid #7ca4f4; outline-offset: 4px; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-danger { background: #c0392b; }
        .btn-danger:hover { background: #96281b; }
        .btn-secondary { background: transparent; color: #234fa5; border: 1px solid #dde5ef; }
        .btn-secondary:hover { background: #f3f6fb; }

        .task-list { list-style: none; padding: 0; margin: 0; }
        .task-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0f3f8; }
        .task-item:last-child { border-bottom: 0; }
        .task-desc { flex: 1; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
        .task-desc.done { text-decoration: line-through; color: #526079; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
        .badge-pending { background: #fef3cd; color: #856404; }
        .badge-in-progress { background: #cce5ff; color: #004085; }
        .badge-done { background: #d4edda; color: #155724; }

        .task-actions { display: flex; gap: 6px; flex-shrink: 0; }
        select { padding: 5px 8px; border: 1px solid #dde5ef; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; }

        .empty { text-align: center; color: #526079; padding: 16px 0; font-size: 14px; }

        @media (max-width: 700px) {
            body { padding: 16px; }
            .section { padding: 24px; }
            .profile-header { flex-direction: column; align-items: flex-start; }
            dl { grid-template-columns: 1fr; }
            .task-item { flex-wrap: wrap; gap: 8px; }
            .task-actions { width: 100%; }
        }
    </style>
</head>
<body>
<main>
    <!-- Profile -->
    <section class="section" aria-labelledby="profile-heading">
        <div class="profile-header">
            <img th:if="${avatarUrl != null}" th:src="${avatarUrl}" class="avatar"
                 width="72" height="72" alt="Your GitHub avatar" referrerpolicy="no-referrer">
            <div class="profile-info">
                <h1 class="profile-name" th:text="${displayName ?: githubLogin ?: 'Welcome'}"></h1>
                <p th:if="${githubLogin != null}" class="profile-login" th:text="'@' + ${githubLogin}"></p>
            </div>
        </div>
        <dl>
            <dt>GitHub ID</dt><dd th:text="${githubId ?: 'Not provided'}"></dd>
            <dt>Email</dt><dd th:text="${email ?: 'Not provided'}"></dd>
        </dl>
        <form th:action="@{/logout}" method="post" style="margin-top:20px">
            <button type="submit" class="btn btn-secondary btn-sm">Sign out</button>
        </form>
    </section>

    <!-- Cat fact -->
    <section class="section" aria-labelledby="cat-fact-heading">
        <h2 id="cat-fact-heading">Cat fact</h2>
        <p id="cat-fact" class="cat-fact" th:data-url="@{/api/cat-fact}" role="status">Loading a cat fact…</p>
    </section>

    <!-- Tasks -->
    <section class="section" aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Tasks</h2>
        <form th:action="@{/tasks}" method="post" class="new-task">
            <input type="text" name="description" placeholder="What needs to be done?" required minlength="1" maxlength="255" autocomplete="off">
            <button type="submit" class="btn btn-sm">Add</button>
        </form>
        <div th:if="${#lists.isEmpty(tasks)}" class="empty">
            No tasks yet. Add one above!
        </div>
        <ul th:unless="${#lists.isEmpty(tasks)}" class="task-list">
            <li th:each="task : ${tasks}" class="task-item">
                <span th:classappend="${task.status().name() == 'DONE'} ? 'done'" class="task-desc" th:text="${task.description()}"></span>
                <span th:classappend="'badge-' + ${task.status().name().toLowerCase().replace('_', '-')}" class="badge" th:text="${task.status().name().replace('_', ' ')}"></span>
                <div class="task-actions">
                    <form th:action="@{'/tasks/' + ${task.id()} + '/status'}" method="post" style="display:inline">
                        <select name="status" onchange="this.form.submit()">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name().replace('_', ' ')}" th:selected="${s == task.status()}"></option>
                        </select>
                    </form>
                    <form th:action="@{'/tasks/' + ${task.id()} + '/delete'}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </div>
            </li>
        </ul>
    </section>
</main>
<script>
    const catFact = document.getElementById('cat-fact');

    async function loadCatFact() {
        try {
            const response = await fetch(catFact.dataset.url, {
                headers: { Accept: 'application/json' },
                redirect: 'error'
            });
            if (!response.ok) {
                throw new Error('Could not load a cat fact');
            }
            const { fact } = await response.json();
            catFact.textContent = fact;
        } catch {
            catFact.textContent = 'Could not load a cat fact. Try reloading the page.';
        }
    }

    loadCatFact();
</script>
</body>
</html>
